<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente Neon Pulsante -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#10B981;#3B82F6;#8B5CF6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#3B82F6;#8B5CF6;#10B981" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Filter para Efeito Glow Cyberpunk -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern Movimentado -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#0A0A0B" rx="16"/>

  <!-- Grid Animado -->
  <rect width="100%" height="100%" fill="url(#cyberGrid)" rx="16">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Escudo 3D Holográfico Central -->
  <g transform="translate(600, 150)" filter="url(#cyberGlow)">
    <path d="M 0 -70 L 60 -35 L 60 35 Q 0 90 -60 35 L -60 -35 Z" fill="none" stroke="url(#neonGradient)" stroke-width="4">
      <animate attributeName="stroke-width" values="4;7;4" dur="2.5s" repeatCount="indefinite"/>
    </path>

    <!-- Ícone de Segurança Interior -->
    <path d="M -15 -10 L 0 -25 L 15 -10 L 15 15 L 0 25 L -15 15 Z" fill="url(#neonGradient)" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.4;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Partículas Flutuantes -->
  <circle cx="250" cy="120" r="3" fill="#8B5CF6" opacity="0.6">
    <animate attributeName="cy" values="120;80;120" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="950" cy="220" r="4" fill="#10B981" opacity="0.7">
    <animate attributeName="cy" values="220;180;220" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Texto Principal de Marca -->
  <text x="600" y="285" text-anchor="middle" font-family="'Fira Code', monospace" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="2">
    URION DEV VIBE
  </text>
  
  <text x="600" y="325" text-anchor="middle" font-family="'Fira Code', monospace" font-size="20" font-weight="600" fill="url(#neonGradient)" letter-spacing="6">
    SAFEGUARD PLATFORM
  </text>

  <!-- Status Tag em Tempo Real -->
  <g transform="translate(600, 360)">
    <rect x="-110" y="-14" width="220" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1"/>
    <circle cx="-85" cy="-2" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="2" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#10B981">
      DOGMA ZERO • 100% HEALTHY
    </text>
  </g>
</svg>
